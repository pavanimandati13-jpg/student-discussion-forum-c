<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Discussion Forum</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 Student Discussion Forum</h1>
      <p>Ask Questions • Share Knowledge • Help Friends</p>
    </header>

    <!-- User Login / Register Card -->
    <div id="auth-box" class="card">
      <h3 id="auth-title">Student Login</h3>
      <input type="text" id="user-name-input" placeholder="Enter your full name" />
      <input type="email" id="email-input" placeholder="Enter your email" />
      <div class="btn-group">
        <button onclick="handleLogin()" class="btn btn-primary">Login / Enter Forum</button>
      </div>
    </div>

    <!-- Active User Header -->
    <div id="user-profile" class="card hidden">
      <p>Logged in as: <strong id="logged-user-name"></strong> (<span id="logged-user-email"></span>)</p>
      <button onclick="handleLogout()" class="btn btn-danger">Switch User</button>
    </div>

    <!-- Question Posting Form -->
    <div id="post-form" class="card hidden">
      <h3>Post a New Question</h3>
      <input type="text" id="post-title" placeholder="Discussion Title (e.g., Node.js, Cloud Computing)" />
      <textarea id="post-body" placeholder="Write your question or discussion details here..."></textarea>
      <button onclick="createPost()" class="btn btn-primary">Post Question</button>
    </div>

    <!-- Search & Feed -->
    <div class="feed-section">
      <input type="text" id="search-input" placeholder="🔍 Search discussions..." oninput="filterPosts()" />
      
      <div class="feed-header">
        <h2>Recent Discussions</h2>
        <button onclick="clearAllData()" class="btn-text">Clear Reset Data</button>
      </div>

      <div id="discussions-container">
        <!-- Posts render here dynamically -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
